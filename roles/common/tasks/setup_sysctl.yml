---
- name: Disable ICMP redirect protocols
  ansible.posix.sysctl:
    name: "{{ item }}"
    value: '0'
    sysctl_set: true
    state: present
    reload: true
  become: true
  loop:
  - net.ipv4.conf.all.accept_redirects
  - net.ipv4.conf.default.accept_redirects
  - net.ipv4.conf.all.secure_redirects
  - net.ipv4.conf.default.secure_redirects
  - net.ipv6.conf.all.accept_redirects
  - net.ipv6.conf.default.accept_redirects
  - net.ipv4.conf.all.send_redirects
  - net.ipv4.conf.default.send_redirects

- name: Disable ICMP echo requests
  ansible.posix.sysctl:
    name: "{{ item }}"
    value: '1'
    sysctl_set: true
    state: present
    reload: true
  become: true
  loop:
  - net.ipv4.icmp_echo_ignore_all
  - net.ipv6.icmp.echo_ignore_all
  when: common_ping_disabled | bool

- name: Tune TCP keepalive
  ansible.posix.sysctl:
    name: "{{ item.key }}"
    value: "{{ item.value }}"
    sysctl_set: true
    state: present
    reload: true
  become: true
  loop: "{{ common_tcp_keepalive | dict2items }}"

- name: Improve TCP settings
  ansible.posix.sysctl:
    name: "{{ item.key }}"
    value: "{{ item.value }}"
    sysctl_set: true
    state: present
    reload: true
  become: true
  loop: "{{ common_tcp_settings | dict2items }}"
