---
- name: Add Tailscale repository
  ansible.builtin.yum_repository:
    name: tailscale-stable
    description: Tailscale stable
    file: tailscale
    baseurl: https://pkgs.tailscale.com/stable/rhel/$releasever/$basearch
    gpgcheck: true
    repo_gpgcheck: true
    enabled: true
    gpgkey: https://pkgs.tailscale.com/stable/rhel/$releasever/repo.gpg
    owner: root
    group: root
    mode: '0644'
    state: present
  become: true

- name: Install Tailscale
  ansible.builtin.dnf:
    name: tailscale
    state: present
    update_cache: true
  become: true

- name: Enable and start tailscaled service
  ansible.builtin.service:
    name: tailscaled
    state: started
    enabled: true
  become: true

- name: Enable IP forwarding for subnet routing / exit node
  ansible.posix.sysctl:
    name: "{{ item }}"
    value: '1'
    sysctl_set: true
    state: present
    reload: true
  become: true
  loop:
    - net.ipv4.ip_forward
    - net.ipv6.conf.all.forwarding
  when: "'--advertise-exit-node' in common_tailscale_up_args or '--advertise-routes' in common_tailscale_up_args"

- name: Get current Tailscale backend state
  ansible.builtin.command: tailscale status --json
  register: common_tailscale_status
  changed_when: false
  failed_when: false
  become: true

- name: Bring Tailscale up
  ansible.builtin.command: >-
    tailscale up
    --authkey {{ common_tailscale_authkey }}
    {{ common_tailscale_up_args }}
  become: true
  no_log: true
  when:
    - common_tailscale_authkey | length > 0
    - (common_tailscale_status.stdout | default('{}', true) | from_json).BackendState | default('NeedsLogin') != 'Running'
  changed_when: true
